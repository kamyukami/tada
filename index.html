<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="build" content="202610191910">
<meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e4e4e4" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tada">
<link rel="manifest" href="manifest.webmanifest">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Tada</title>
<style>
/* Same brut screen as Notus: one dark screen, no page scroll, 8 px grid, 16 px gutter, no radius, no shadow, four greys.
   Browse: top 48 · photo (flex) · [drawer, up to half the screen] · bottom 48 (Transform / Add / Export).
   Edit:   top 48 (effect name, Reset) · photo · panel (option row 48 + value 64) · bottom 48 (Cancel / Done). */
:root{--bg:#111111;--panel:#1f1f1f;--fg:#f2f2f2;--muted:#c4c4c4;--on:#111111;--shade:rgba(17,17,17,.9);--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f2f2f2;--panel:#e4e4e4;--fg:#111111;--muted:#3a3a3a;--on:#f2f2f2;--shade:rgba(242,242,242,.92);color-scheme:light}}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--fg);font:14px/1.3 var(--mono)}
button,.btn{font:inherit;color:inherit;background:none;border:0;border-radius:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.3}
button:focus-visible,.btn:focus-within{outline:2px solid var(--fg);outline-offset:-2px}
#file{position:fixed;left:-100px;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.screen{height:100%;height:100dvh;display:flex;flex-direction:column}
.screen:not(.ready) .top,.screen:not(.ready) .bottom,.screen:not(.ready) .drawer,.screen:not(.ready) .panel{display:none!important}
.cap{text-transform:uppercase;letter-spacing:.08em}

.top{display:flex;align-items:stretch;height:48px;background:var(--panel);padding:env(safe-area-inset-top,0px) max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));box-sizing:content-box}
.top .sp{flex:1}
.top .btn,.top button,.top .title{display:flex;align-items:center;padding:0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.top .title{font-weight:700}
.top .ico{font-size:18px;letter-spacing:0;min-width:40px;justify-content:center}
.top .count{color:var(--muted)}

.photo{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:8px;touch-action:none;overflow:hidden}
.photo canvas{display:block;transform-origin:center;will-change:transform}
.photo #pad{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.empty{display:grid;gap:16px;justify-items:center;text-align:center;padding:16px}
.empty .pick{display:flex;align-items:center;justify-content:center;width:min(80vw,320px);height:64px;background:var(--fg);color:var(--on);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;cursor:pointer}
.empty p{margin:0;color:var(--muted);font-size:12px;max-width:28em}
.err{color:var(--fg)!important;text-decoration:underline}
.photo .tip{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--bg);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:8px 12px;pointer-events:none;white-space:nowrap;opacity:0}
.photo .tip.on{opacity:1}

#busy{position:fixed;inset:0;z-index:40;background:var(--shade);display:flex;align-items:center;justify-content:center;gap:16px;font-size:14px;text-transform:uppercase;letter-spacing:.1em}
#busy .dots{display:flex;gap:6px}
#busy .dots i{width:8px;height:8px;background:var(--fg);animation:pulse 1s infinite}
#busy .dots i:nth-child(2){animation-delay:.2s}
#busy .dots i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.15}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){#busy .dots i{animation:none;opacity:1}}
#shade{position:fixed;inset:0;background:var(--shade);z-index:30;pointer-events:none}
#wheel{position:fixed;inset:0;z-index:31;pointer-events:none;overflow:hidden}
#wheelItems{position:absolute;left:var(--x,0px);width:var(--w,100%);top:0;transform:translateY(var(--y,0));transition:transform .12s ease-out}
#wheelItems div{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 44px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
#wheelItems div b{font-variant-numeric:tabular-nums}
#wheelItems div.cur{background:var(--fg);color:var(--on)}
.picking .panel{visibility:hidden}

/* drawer: a list of effects (or the export choice); the photo shrinks to make room */
.drawer{background:var(--panel);max-height:50vh;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;box-sizing:border-box;padding:16px}
.drawer .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drawer .grid button{height:48px;background:var(--bg);text-align:left;padding:0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.drawer .grid button small{display:block;color:var(--muted);font-size:10px;letter-spacing:.06em;margin-top:2px}
.drawer .fmt{display:flex;height:48px;margin-bottom:8px}
.drawer .fmt button{flex:1;color:var(--muted);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.drawer .fmt button[aria-pressed="true"]{color:var(--fg);box-shadow:inset 0 -2px 0 var(--fg)}
.ver{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;text-align:center;margin-top:8px}
.drawer .go{width:100%;height:56px;background:var(--fg);color:var(--on);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}

/* edit panel: the option name (vertical drag picks another), the value (horizontal drag adjusts) */
.panel{background:var(--panel);padding:0 16px;touch-action:none}
.panel .menu{display:flex;align-items:center;gap:12px;height:48px;margin:0 -16px;padding:0 16px;border-bottom:1px solid var(--bg);font-size:14px;text-transform:uppercase;letter-spacing:.08em;cursor:ns-resize}
.panel .menu .chev{color:var(--muted);width:16px;letter-spacing:0}
.panel .menu .hint{margin-left:auto;color:var(--muted);font-size:11px}
.panel .val{height:64px;display:flex;align-items:center;justify-content:center;gap:16px;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;cursor:ew-resize}
.panel .val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.panel .val i{font-style:normal;font-size:12px;color:var(--muted);font-weight:400}
.panel .val.on{box-shadow:inset 0 -2px 0 var(--fg)}

.bottom{display:grid;grid-template-columns:repeat(4,1fr);height:48px;background:var(--panel);border-top:1px solid var(--bg);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);box-sizing:content-box}
.bottom button{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.bottom button[aria-pressed="true"]{color:var(--fg);box-shadow:inset 0 2px 0 var(--fg)}
.bottom.two{grid-template-columns:1fr 1fr}
.bottom.two #done{background:var(--fg);color:var(--on);font-weight:700;letter-spacing:.1em}
/* layers: top row = top layer. Mode: tap to cycle. Opacity: drag sideways. */
.drawer .layers{display:grid;gap:8px}
.drawer .layers .none{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:12px 0}
.drawer .lyr{display:grid;grid-template-columns:1fr 76px 48px 32px 32px 32px;gap:4px;height:48px;background:var(--bg);align-items:stretch}
.drawer .lyr>*{display:flex;align-items:center;justify-content:center;font-size:12px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden}
.drawer .lyr .nm{justify-content:flex-start;padding-left:12px;text-overflow:ellipsis;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--muted)}
.drawer .lyr .md{background:var(--panel);touch-action:none;cursor:ns-resize}
.drawer .lyr .op{background:var(--panel);font-weight:700;font-variant-numeric:tabular-nums;touch-action:none;cursor:ew-resize}
.drawer .lyr button:disabled{opacity:.2}
.full .top,.full .drawer,.full .panel,.full .bottom{display:none!important}
</style>
</head>
<body>
<div class="screen" id="editScreen">
  <input type="file" id="file" accept="image/*">
  <div class="top" id="topBar">
    <label class="btn" for="file" id="change" hidden>Photo</label>
    <span class="title" id="title" hidden></span>
    <span class="sp"></span>
    <span class="title count" id="count" hidden></span>
    <button type="button" class="ico" id="undo" title="Undo" disabled hidden>↶</button>
    <button type="button" class="ico" id="redo" title="Redo" disabled hidden>↷</button>
    <button type="button" id="reset" title="Remove every effect" hidden>Reset</button>
    <button type="button" id="optReset" title="Back to the default values" hidden>Reset</button>
  </div>

  <div class="photo" id="photoArea">
    <div class="empty" id="empty">
      <label class="pick" for="file" id="pickText">Choose a photo</label>
      <p id="pickMsg">Turn what a photo knows about itself — depth, faces, bodies, colours, metadata — into images. Nothing is sent; everything runs on this device.</p>
      <p class="ver" id="ver1"></p>
    </div>
    <canvas id="view" hidden></canvas>
    <canvas id="pad" hidden></canvas>
    <div class="tip" id="tip">Hold the photo to adjust</div>
  </div>

  <div class="drawer" id="drTransform" hidden><div class="grid"></div></div>
  <div class="drawer" id="drAdd" hidden><div class="grid"></div></div>
  <div class="drawer" id="drLayers" hidden><div class="layers" id="layerList"></div></div>
  <div class="drawer" id="drExport" hidden>
    <div class="fmt"><button type="button" data-fmt="jpeg" aria-pressed="true">JPEG</button><button type="button" data-fmt="png" aria-pressed="false">PNG</button></div>
    <button type="button" class="go" id="save">Save</button>
    <div class="ver" id="ver2"></div>
  </div>

  <div class="panel" id="panel" hidden>
    <div class="menu" id="optMenu"><span class="chev">⇅</span><span class="name" id="optName"></span><span class="hint" id="optHint"></span></div>
    <div class="val" id="optVal"></div>
  </div>

  <div id="busy" hidden><span id="busyText">Analysing</span><span class="dots"><i></i><i></i><i></i></span></div>
  <div id="shade" hidden></div>
  <div id="wheel" hidden><div id="wheelItems"></div></div>
  <div class="bottom" id="bottom" hidden>
    <button type="button" data-dr="Transform">Transform</button>
    <button type="button" data-dr="Add">Add</button>
    <button type="button" data-dr="Layers">Layers</button>
    <button type="button" data-dr="Export">Export</button>
  </div>
  <div class="bottom two" id="editBar" hidden>
    <button type="button" id="cancel">Cancel</button>
    <button type="button" id="done">Done</button>
  </div>
</div>

<script type="module">
import * as ort from './vendor/ort.wasm.bundle.min.mjs';
(() => {
  const $ = id => document.getElementById(id);
  const base = document.createElement('canvas');   // the photo, at most 1600 px — every analysis runs on it, never on the effects
  const comp = document.createElement('canvas');   // base + the validated effects
  const out  = $('view');                          // comp + the effect being edited
  let fmt = 'jpeg', compVersion = 0, file = null;

  // ================= effects =================
  // Two kinds: Transform (rewrites the pixels) and Add (draws on top). Effects stack in order, without masks.
  // The options drive the DATA behind the effect (depth range, thresholds, smoothing, confidence…); the look itself
  // has at most one or two options. No mix / opacity here: that is the Layers drawer's job.
  // Every option is a plain number, 0…100 or −100…100; desc (optional) names what a value means.
  const O = (k, label, def, min = 0, desc) => ({ k, label, def, min, max: 100, desc });
  // XY: two options that belong together, driven by one 2D pad (hold the photo); both axes absolute, shown normalized.
  const XY = (label, a, b) => ({ xy: true, label, a, b, k: a.k + '+' + b.k });
  const DIRS = ['Down', 'Up', 'Right', 'Left'], dirOf = v => Math.min(3, Math.floor(v / 25));
  const RANGE = XY('Depth range', O('start', 'From', 0), O('end', 'To', 100));
  const LINE = (w = 20, l = 100) => XY('Line', O('w', 'Thickness', w), O('l', 'Lightness', l));
  const grey = v => { const g = v.l / 100 * 255; return [g, g, g]; };
  const range01 = (v, d) => { const a = Math.min(v.start, v.end) / 100, b = Math.max(v.start, v.end) / 100; return (d - a) / Math.max(0.001, b - a); };
  const faces = v => L.faces.filter(f => f.box.score >= (v.thr ?? 50) / 100);
  const people = v => L.pose.filter(p => p.score >= (v.person ?? 20) / 100);
  const avgPt = (P, ids) => ids.reduce((a, i) => ({ x: a.x + P[i].x / ids.length, y: a.y + P[i].y / ids.length }), { x: 0, y: 0 });
  const span = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
  const MOUTH = span(52, 71), NOSE = span(72, 86);   // 2d106det: 0–32 jaw, 33–42 / 87–96 eyes (centres 38 / 88), 43–51 / 97–105 brows

  const EFFECTS = [
    // ---------- Transform · depth ----------
    { k: 'orbit', label: 'Orbit', kind: 'T', needs: ['depth'],
      opts: [XY('Orbit', O('x', 'X', 30, -100), O('y', 'Y', 0, -100)), XY('Camera', O('focal', 'Focal', 40), O('depth', 'Depth scale', 50)), O('density', 'Point density', 70)],
      run(ctx, v) {   // every pixel back in 3D from the depth, seen from a camera turned around the scene; gaps stay black
        const W = ctx.canvas.width, H = ctx.canvas.height, f = L.depth.near, src = ctx.getImageData(0, 0, W, H).data;
        const im = ctx.createImageData(W, H), od = im.data, zb = new Float32Array(W * H).fill(Infinity);
        for (let j = 3; j < od.length; j += 4) od[j] = 255;
        const step = Math.max(1, Math.round(1 + (100 - v.density) / 100 * 5)), fo = (0.4 + v.focal / 100 * 2.2) * Math.max(W, H), ds = 0.05 + v.depth / 100 * 3;
        const yaw = v.x / 100 * 0.7, pitch = v.y / 100 * 0.5, cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch), zc = 1 + ds * 0.5, ox = W / 2, oy = H / 2;
        for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) {
          const i = y * W + x, z = 1 + (1 - f[i]) * ds, X = (x - ox) / fo * z, Y = (y - oy) / fo * z, Z = z - zc;
          const X1 = X * cy + Z * sy, Z1 = -X * sy + Z * cy, Y1 = Y * cp - Z1 * sp, Z2 = Y * sp + Z1 * cp + zc;
          if (Z2 <= 0.05) continue;
          const u = Math.round(X1 / Z2 * fo + ox), w = Math.round(Y1 / Z2 * fo + oy), s = clamp(Math.ceil(step * 1.3 * zc / Z2), 1, 10);
          for (let b = 0; b < s; b++) { const yy = w + b; if (yy < 0 || yy >= H) continue; for (let a = 0; a < s; a++) { const xx = u + a; if (xx < 0 || xx >= W) continue; const j = yy * W + xx; if (Z2 < zb[j]) { zb[j] = Z2; od[j * 4] = src[i * 4]; od[j * 4 + 1] = src[i * 4 + 1]; od[j * 4 + 2] = src[i * 4 + 2]; } } }
        }
        ctx.putImageData(im, 0, 0);
      } },
    { k: 'scan', label: 'Scan', kind: 'T', needs: ['depth'],
      opts: [RANGE, XY('Lines', O('lines', 'Count', 20), O('amp', 'Amplitude', 60)), O('smooth', 'Smoothing', 20), O('w', 'Thickness', 10)],
      run(ctx, v) {   // horizontal lines lifted by the depth, nearer lines hiding the farther ones; colours from the photo
        const W = ctx.canvas.width, H = ctx.canvas.height, f = smoothDepth(v.smooth), src = ctx.getImageData(0, 0, W, H).data;
        const n = 10 + Math.round(v.lines / 100 * 150), gap = H / (n + 1), amp = v.amp / 100 * H * 0.3, st = Math.max(2, Math.round(W / 400));
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.lineWidth = px1(ctx) * (0.5 + v.w / 100 * 8); ctx.lineCap = 'round';
        for (let li = 1; li <= n; li++) {
          const y0 = li * gap, row = Math.min(H - 1, y0 | 0), pts = [];
          for (let x = 0; x < W + st; x += st) { const xx = Math.min(W - 1, x), t = clamp(range01(v, f[row * W + xx]), 0, 1); pts.push([xx, y0 - t * amp]); }
          ctx.beginPath(); ctx.moveTo(0, H); for (const [x, y] of pts) ctx.lineTo(x, y); ctx.lineTo(W, H); ctx.closePath(); ctx.fillStyle = '#000'; ctx.fill();
          for (let k = 1; k < pts.length; k++) { const j = (row * W + pts[k][0]) * 4; ctx.strokeStyle = `rgb(${src[j]},${src[j + 1]},${src[j + 2]})`; ctx.beginPath(); ctx.moveTo(pts[k - 1][0], pts[k - 1][1]); ctx.lineTo(pts[k][0], pts[k][1]); ctx.stroke(); }
        }
      } },
    { k: 'depthsort', label: 'Depth sort', kind: 'T', needs: ['depth'],
      opts: [XY('Depth range', O('start', 'From', 40), O('end', 'To', 100)), O('dir', 'Direction', 0, 0, v => DIRS[dirOf(v)]), O('min', 'Bright from', 20)],
      run(ctx, v) {   // pixel sort, only inside one slice of depth
        const f = L.depth.near, m = v.min / 100 * 255;
        pixels(ctx, (px, n, W, H) => sortRuns(px, W, H, i => { const t = range01(v, f[i]); return t >= 0 && t <= 1; }, dirOf(v.dir), m));
      } },
    { k: 'lens', label: 'Lens', kind: 'T', needs: ['depth'], opts: [XY('Focus', O('focus', 'Focus depth', 50), O('range', 'Depth of field', 20)), O('blur', 'Aperture', 50)],
      run(ctx, v, live) {
        const f = L.depth.near, lv = blurLevels(ctx.canvas, v.blur, live), fo = v.focus / 100, r = v.range / 200;
        pixels(ctx, (px, n) => { for (let i = 0; i < n; i++) {
          const t = Math.min(3, Math.max(0, (Math.abs(f[i] - fo) - r) / 0.12)); if (t <= 0) continue;
          const a = t | 0, b = Math.min(3, a + 1), w = t - a, A = a ? lv[a - 1] : null, B = lv[b - 1];
          for (let k = 0; k < 3; k++) { const j = i * 4 + k, va = A ? A[j] : px[j]; px[j] = va + (B[j] - va) * w; }
        } });
      } },
    { k: 'relight', label: 'Relight', kind: 'T', needs: ['depth'], opts: [XY('Light', O('lx', 'Left / right', -50, -100), O('ly', 'Down / up', 50, -100)), XY('Surface', O('scale', 'Depth scale', 50), O('smooth', 'Smoothing', 20)), O('amount', 'Strength', 60)],
      run(ctx, v) {
        const N = normals(v.scale, v.smooth), r = Math.min(1, Math.hypot(v.lx, v.ly) / 100), e = (90 - 80 * r) * Math.PI / 180, dx = r ? v.lx / 100 / r : 0, dy = r ? v.ly / 100 / r : 0;
        // the pad is the light seen from above the photo: centre = overhead, edge = grazing; up = from the top of the image
        const Lx = Math.cos(e) * dx, Ly = -Math.cos(e) * dy, Lz = Math.sin(e), k = v.amount / 100 * 3;
        pixels(ctx, (px, n) => { for (let i = 0; i < n; i++) { const s = Math.max(0, 1 + k * (N.nx[i] * Lx + N.ny[i] * Ly + N.nz[i] * Lz - Lz)); px[i * 4] *= s; px[i * 4 + 1] *= s; px[i * 4 + 2] *= s; } });
      } },
    { k: 'depthmap', label: 'Depth map', kind: 'T', needs: ['depth'], opts: [RANGE, O('smooth', 'Smoothing', 0)],
      run(ctx, v) { const f = smoothDepth(v.smooth); pixels(ctx, (px, n) => { for (let i = 0; i < n; i++) { const g = clamp(range01(v, f[i]), 0, 1) * 255; px[i * 4] = px[i * 4 + 1] = px[i * 4 + 2] = g; } }); } },
    { k: 'normalmap', label: 'Normal map', kind: 'T', needs: ['depth'], opts: [XY('Surface', O('scale', 'Depth scale', 50), O('smooth', 'Smoothing', 20))],
      run(ctx, v) { const N = normals(v.scale, v.smooth); pixels(ctx, (px, n) => { for (let i = 0; i < n; i++) { px[i * 4] = (N.nx[i] * 0.5 + 0.5) * 255; px[i * 4 + 1] = (N.ny[i] * -0.5 + 0.5) * 255; px[i * 4 + 2] = N.nz[i] * 255; } }); } },

    // ---------- Transform · faces, bodies ----------
    { k: 'mesh', label: 'Mesh', kind: 'T', needs: ['faces'], opts: [O('thr', 'Detection', 50), XY('Mesh', O('pts', 'Point density', 60), O('margin', 'Margin', 30)), O('edge', 'Edges', 0)],
      run(ctx, v) {   // landmarks triangulated, each triangle filled with the photo's colour under it
        const W = ctx.canvas.width, H = ctx.canvas.height, src = ctx.getImageData(0, 0, W, H).data, keep = Math.max(1, Math.round(1 + (100 - v.pts) / 100 * 7));
        const at = (x, y) => { const j = (clamp(y | 0, 0, H - 1) * W + clamp(x | 0, 0, W - 1)) * 4; return [src[j], src[j + 1], src[j + 2]]; };
        for (const f of faces(v)) {
          const P = f.pts.filter((_, i) => i % keep === 0).concat(scalePoly(f.poly, 0.85 + v.margin / 100 * 0.8));
          for (const [a, b, c] of delaunay(P)) {
            const A = P[a], B = P[b], C = P[c], m = { x: (A.x + B.x + C.x) / 3, y: (A.y + B.y + C.y) / 3 };

        const n = FX[edit.k].opts.length, i = clamp(g.i0 - Math.round((e.clientY - g.y) / ROW), 0, n - 1);
        if (i !== edit.i) { edit.i = i; hap(); panel(); showWheel(i); }
        return;
      }
      if (!g.moved && Math.hypot(e.clientX - g.x, e.clientY - g.y) > 12) { g.moved = true; clearTimeout(g.hold); }
    };
    const end = e => {
      if (!g || e.pointerId !== g.id) return;
      hideWheel(); if (!gridOn) hidePad(); activity(); clearTimeout(g.hold);
      const tap = !g.moved && e.type === 'pointerup';
      if (g.peek) peek(false);
      else if (g.axis === 'toggle' && tap) { gridOn = !gridOn; try { localStorage.setItem('tada-grid', gridOn ? '1' : '0'); } catch {} hap(); if (!gridOn) hidePad(); panel(); }
      else if (!g.axis && tap && g.where === 'photo') { if (drawer) openDrawer(drawer); else toggleFull(); }
      g = null;
    };
    for (const [el, where] of [[$('photoArea'), 'photo'], [$('panel'), 'panel']]) {
      el.addEventListener('pointerdown', e => begin(e, where));
      el.addEventListener('pointermove', move); el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    }
  }

  // ================= flow =================
  function fileToImage(f) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(f), im = new Image();
      im.onload = () => { URL.revokeObjectURL(url); res(im); };
      im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Unreadable image')); };
      im.src = url;
    });
  }
  async function process(f) {
    $('pickMsg').classList.remove('err');
    try {
      const im = await fileToImage(f), s = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
      base.width = Math.round(im.naturalWidth * s); base.height = Math.round(im.naturalHeight * s);
      base.getContext('2d', { willReadFrequently: true }).drawImage(im, 0, 0, base.width, base.height);
      file = f; L = {}; pend = {}; blurCache = null; stack = []; hist = [[]]; hi = 0; edit = null; drawer = null;
      $('empty').hidden = true; $('view').hidden = false; $('editScreen').classList.add('ready');
      full = false; $('editScreen').classList.remove('full');
      renderStack(); ui(); fit();
    } catch (err) {
      $('pickMsg').textContent = 'Error: ' + (err && err.message || err); $('pickMsg').classList.add('err'); $('empty').hidden = false; $('view').hidden = true;
    }
    $('file').value = '';
  }

  document.addEventListener('contextmenu', e => e.preventDefault());   // a long press must never open a menu (Android)
  buildDrawers(); zoomGestures($('photoArea')); gestures(); ui();
  $('file').addEventListener('change', e => { if (e.target.files[0]) process(e.target.files[0]); });
  $('undo').addEventListener('click', () => { if (hi > 0) { hi--; restore(); } });
  $('redo').addEventListener('click', () => { if (hi < hist.length - 1) { hi++; restore(); } });
  $('reset').addEventListener('click', () => { if (!stack.length) return; stack = []; renderStack(); commit(); if (drawer === 'Layers') layersUI(); });
  $('optReset').addEventListener('click', () => { if (!edit) return; edit.v = defaults(FX[edit.k]); hap(); panel(); render(); });
  $('cancel').addEventListener('click', () => exitEdit(false));
  $('done').addEventListener('click', () => exitEdit(true));
  for (const b of document.querySelectorAll('#bottom button')) b.addEventListener('click', () => openDrawer(b.dataset.dr));
  $('drExport').addEventListener('click', e => {
    const b = e.target.closest('[data-fmt]'); if (!b) return;
    fmt = b.dataset.fmt; for (const x of $('drExport').querySelectorAll('[data-fmt]')) x.setAttribute('aria-pressed', x.dataset.fmt === fmt);
    prepare();
  });
  // Save: the blob is prepared as soon as the Export drawer opens, so the tap on Save can open the share sheet
  // right away (iOS needs it inside the tap) — the share sheet offers "Save Image", which goes to Photos.
  // Without file sharing (desktop browsers): a plain download.
  const flash = msg => { const b = $('save'); b.textContent = msg; clearTimeout(flash.t); flash.t = setTimeout(() => { b.textContent = 'Save'; }, 1600); };
  let ready = null;   // { key, file }
  function prepare() {
    const key = compVersion + '/' + fmt; if (ready && ready.key === key) return;
    ready = { key, file: null };
    comp.toBlob(b => { if (ready.key === key && b) ready.file = new File([b], `tada-${Date.now() % 1e6}.${fmt === 'png' ? 'png' : 'jpg'}`, { type: b.type }); },
      fmt === 'png' ? 'image/png' : 'image/jpeg', 0.92);   // the stack only; canvas output never carries EXIF
  }
  $('save').addEventListener('click', async () => {
    prepare();
    if (!ready.file) { flash('Preparing…'); return; }
    const f = ready.file;
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f] }); flash('Done'); }
      catch (e) { if (e.name !== 'AbortError') flash('Could not save'); }
      return;
    }
    const dl = window.claude ? await claude.use('downloads') : null;
    if (dl) { try { await dl.save({ filename: f.name, data: f }); flash('Saved'); } catch (e) { flash(e.code === 'declined' ? 'Cancelled' : 'Could not save'); } return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });

  const BUILD = document.querySelector('meta[name="build"]').content;
  // Version shown on the landing page and in Export. Bump VERSION by one at every published update.
  const VERSION = 17;
  for (const id of ['ver1', 'ver2']) $(id).textContent = `v${VERSION}`;
  async function checkUpdate() {
    try {
      const t = await (await fetch('./?check=' + Date.now(), { cache: 'no-store' })).text(), m = t.match(/name="build" content="([^"]+)"/);
      if (m && m[1] !== BUILD && !base.width) location.replace('./?v=' + m[1]);
    } catch {}
  }
  checkUpdate(); document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
  const pin = () => { if (scrollX || scrollY) scrollTo(0, 0); };
  addEventListener('scroll', pin, { passive: true }); visualViewport && visualViewport.addEventListener('resize', pin);
  window.__tada = { process, enterEdit, exitEdit, edit: () => edit, stack: () => stack, out, comp, EFFECTS, undo: () => $('undo').click() };   // for tests
})();
</script>
